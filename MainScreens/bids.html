<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deal With Bids</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="layout">

  <!-- Sidebar -->
    <aside class="sidebar">
    <div class="brand-side">
    <img src="images/logo.png" alt="Logo" class="brand-side__logo">
    </div>


      <!-- Bids Menu -->
      <nav>
        <div class="side-title">Deal With Bids</div>

        <ul class="side-menu">
          <li>
            <a class="side-menu__link is-active" href="bids.html"> <!--same asmake a bid page-->
              <i class="fa-solid fa-plus"></i>
              <span>Make a Bid</span>
            </a>
          </li>

          <li>
            <a class="side-menu__link" href="withdraw-bid.html">
              <i class="fa-solid fa-ban"></i>
              <span>Withdraw a Bid</span>
            </a>
          </li>

          <li class="danger">
            <a class="side-menu__link" href="home.html">
              <i class="fa-solid fa-house"></i>
              <span>Exit</span>
            </a>
          </li>
        </ul>
      </nav>


    </aside>

    <!-- Main Content -->
    <main class="content">
      <header class="content__top">
        <h2>Deal With Bids</h2>
        <p>Choose an option from the left menu.</p>
      </header>

      <section class="card">
        <h3>Make a Bid</h3>
        <p>
          This page is now inside the “Deal With Bids” section.
          Clicking Withdraw will take you to withdraw-bid.html, and Exit goes Home.
        </p>
      </section>
    </main>

  </div>
</body>
</html>
