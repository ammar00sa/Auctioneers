</head>

<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
    <div class="brand-side">
    <img src="images/logo.png" alt="Logo" class="brand-side__logo">
    </div>

      <nav>
        <div class="side-title">Client Maintenance</div>

        <ul class="side-menu">
          <li>
            <!-- Active page -->
            <a class="side-menu__link is-active" href="addClient.html"> <!--same as add a new client page-->
              <i class="fa-solid fa-user-plus"></i>
              <span>Add a New Client</span>
            </a>
          </li>

          <li>
            <a class="side-menu__link" href="deleteClient.html">
              <i class="fa-solid fa-user-minus"></i>
              <span>Delete a Client</span>
            </a>
          </li>

          <li>
            <a class="side-menu__link" href="editClient.html">
              <i class="fa-solid fa-user-pen"></i>
              <span>Amend / View a Client</span>
            </a>

            <a class="side-menu__link" href="../MainScreens/home.html">
              <i class="fa-solid fa-house"></i>
              <span>Exit</span>
            </a>
          </li>
        </ul>
      </nav>


    </aside>

    <!-- Main content -->
    <main class="content">
      <header class="content__top">
        <h2>Client Maintenance</h2>
        <p>Select an option from the left menu.</p>
      </header>

      <section class="card">
        <h3>Add a New Client</h3>
        <p>
          This section will allow you to add new client details.

          <br>
          <br>

          <form action="addClient.php" method="post">


            <label for="fname">Name: </label>
            <input type="text" id="name" name="fname" pattern="[a-zA-Z]*">

            <br>

            

            <label for="eircode">Eircode: </label>
            <input type="text" id="eircode" name="eircode" pattern="([AC-FHKNPRTV-Y]\d{2}|D6W)[ ]?[0-9AC-FHKNPRTV-Y]{4}">

             <br>

            <label for="phone">Phone number: </label>
            <input type="text" name="phone" id="phone">

             <br>

            <label for="email">Email address: </label> 
            <input type="text" name="email" id="email">

            <br>

            
            <label for="fruits">Client type: </label>
		        <select id="clientType" name="clientType">
			      <option value="buyer">Buyer</option>
			      <option value="seller">Seller</option>
		        </select>


            <br>

            
            <label for="email">Address: </label> 
            <input type="text" name="address" id="address">

            <br>
            <br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">


            <br>






          </form>



          
        </p>
      </section>
    </main>

  </div>
</body>
