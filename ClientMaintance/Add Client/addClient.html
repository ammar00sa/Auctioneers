<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Maintenance - Add New Client</title>
    <link rel="stylesheet" href="style.css"> <!--Css stylesheet file connection-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="card">
        <div class="content__top">
            <h2>Client Maintenance</h2>
        </div>

        <form action="addClient.php" method="post">
            <div class="layout">
                <aside class="sidebar">
                    <div class="brand-side">
                        <img src="logo.png" alt="Logo" class="brand-side__logo" />
                    </div>

                    <nav>
                        <div class="side-title">Client Maintenance</div> <!--Left menu section-->
                        <ul class="side-menu">
                            <li>
                                <a class="side-menu__link is-active" href="addClient.html">
                                    <!--Add client(it will direct you to the addClient page)-->
                                    <i class="fa-solid fa-user-plus"></i>
                                    <span>Add a New Client</span>
                                </a>
                            </li>
                            <li>
                                <a class="side-menu__link" href="../Delete Client/deleteClient.html.php">
                                    <!--Delete client(it will direct you to the deleteClient page)-->
                                    <i class="fa-solid fa-user-minus"></i>
                                    <span>Delete a Client</span>
                                </a>
                            </li>
                            <li>
                                <a class="side-menu__link" href="../Amend View/AmendView.html.php">
                                    <!--Edit client(it will direct you to the editClient page)-->
                                    <i class="fa-solid fa-user-pen"></i>
                                    <span>Amend / View a Client</span>
                                </a>
                            </li>

                            <div class="side-divider"></div>

                            <li class="danger">
                                <a class="side-menu__link" href="../MainScreens/home.html">
                                    <i class="fa-solid fa-house"></i>
                                    <span>Exit</span> <!--Exit Button(it redirect you to the main Auctioneers page)-->
                                </a>
                            </li>
                        </ul>
                    </nav>
                </aside>

                <div class="client-grid">

                    <div class="client-panel">
                        <fieldset>
                            <legend>Client Details</legend>


                            <div class="two-col"> <!--Two-col is a CSS class that separates the input into 2 columns-->
                                <div class="col">
                                    <div class="inputbox">
                                        <label for="name">Full Name: <span class="required">*</span></label>
                                        <!--Full name input-->
                                        <input type="text" id="name" name="fname" pattern="[A-Za-z\s]+"
                                            placeholder="Enter name..." required required
                                            oninvalid="this.setCustomValidity('Please only alphabetics characters')"
                                            oninput="this.setCustomValidity('')" maxlength="255">

                                    </div> <!--Full name pattern (it only let input letters)-->

                                    <br>

                                    <div class="inputbox">
                                        <label for="eircode">Eircode: <span class="required">*</span></label>
                                        <!--Eircode input-->
                                        <input type="text" id="eircode" name="eircode"
                                            pattern="[A-Za-z]{1}\d{2}[ ]?[A-Za-z\d]{4}" placeholder="e.g. D02 X285"
                                            required required
                                            oninvalid="this.setCustomValidity('Please enter a correct Eircode')"
                                            oninput="this.setCustomValidity('')" maxlength="255">
                                    </div> <!--Eircode pattern (it only let input an eircode)-->

                                    <br>

                                    <div class="inputbox">
                                        <label for="phone">Phone Number: <span class="required">*</span></label>
                                        <!--Phone number input-->
                                        <input type="tel" name="phone" id="phone" placeholder="(353) - 871262837"
                                            required>
                                    </div>

                                    <br>

                                </div>

                                <div class="col">
                                    <div class="inputbox">
                                        <label for="email">Email Address: <span class="required">*</span></label>
                                        <!--Email address input-->
                                        <input type="email" name="email" id="email" placeholder="client@example.com"
                                            required maxlength="255">
                                    </div>

                                    <br>

                                    <div class="inputbox">
                                        <label for="clientType">Client Type: <span class="required">*</span></label>

                                        <select id="clientType" name="clientType" required
                                            oninvalid="this.setCustomValidity('Please select a type of client')"
                                            oninput="this.setCustomValidity('')">

                                            <option value="">--Select Type--</option>
                                            <option value="buyer">Buyer</option>
                                            <option value="seller">Seller</option>
                                        </select>
                                    </div>

                                    <br>

                                    <div class="inputbox">
                                        <label for="address">Postal Address: <span class="required">*</span></label>
                                        <!--Postal Address input-->
                                        <textarea name="address" id="address" rows="3"
                                            placeholder="Enter full address..." 
                                            required
                                            oninvalid="this.setCustomValidity('Please introduce the Postal Address')"
                                            oninput="this.setCustomValidity('')"
                                            maxlength="255"></textarea>
                                    </div>

                                    <br>
                                </div>
                            </div>


                            <br>
                            <br>
                            <br>


                            <div class="form-actions">
                                <input type="reset" name="cancel" value="Reset">
                                <!--Reset button where it resets the form-->
                                <input type="submit" value="Add New Client" name="submit" onclick="confirmChange(event)">
                                <!--Submit button where it submits the data entered to the Client table-->
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
    </div>
    </form>
    </div>

      <!-- Confirmation for the user before submission -->
    <script>
        function confirmChange(e) {
            let result = confirm("Are you sure (Y/N)?");
            if (!result) {
                // it cancels the event
                e.preventDefault();
            }
        }
    </script>


</body>

</html>
